# Warden 2.0 policy
#
# Edit this file to change what agents are allowed to do.
# No Python changes required. Restart is not required for a fresh Enforcer.

version: 1

defaults:
  # What to do when an agent calls a tool that was never approved.
  #   deny  - block it (recommended)
  #   allow - permit it (discovery mode only)
  unknown_tool: deny

  # Fallback for any drift case not covered by the specific keys below.
  #   quarantine - deny this call AND every future call until a human re-approves
  #   block      - deny this call only
  #   warn       - allow but flag (use during rollout, never in production)
  on_drift: quarantine

  # Risk-aware drift handling.
  #
  # Warden classifies every contract change by whether the tool GAINED POWER,
  # and cross-references it against the version the server declares at
  # initialize. Treating all change as attack means quarantining every routine
  # software update, which is the same thing as being switched off.
  #
  #   elevation       - new permission, new sensitive input field, or a
  #                     description that grew an instruction. Always hostile.
  #   silent mutation - the contract changed but the server still reports the
  #                     same version. The server is contradicting itself.
  #   benign          - strictly less capable: fields removed, scopes given up.
  #   ambiguous       - neither clearly safe nor clearly escalating.
  on_elevation: quarantine
  on_silent_mutation: quarantine
  # Leave these unset to fall back to on_drift above.
  # on_benign_drift: warn
  # on_ambiguous_drift: warn

  # When the server declares a NEW version and nothing escalated, accept the new
  # contract automatically. This is what stops a Tuesday release from paging a
  # human. A version bump is not a free pass: elevation is still quarantined.
  auto_repin_on_version_bump: true

  # An argument the approved input schema never declared is, by definition, not
  # something the tool was approved to receive. It is also how a poisoned
  # description smuggles a payload past a schema that still looks clean.
  #   deny | warn | allow
  on_undeclared_arg: deny

  # What to do when a tool is called with an argument shape never seen before.
  #   deny | warn | allow
  on_novel_arg_shape: warn

  # How many successful calls before the argument-shape baseline is trusted.
  baseline_calls: 3

# Per-server settings. Anything omitted falls back to the defaults above.
#
# version_is_authoritative says whether this server's serverInfo.version can be
# trusted to change when the server changes. It is off by default because real
# servers do not honour it: the official @modelcontextprotocol/server-filesystem
# reports version "0.2.0" while shipping as package 2026.8.31.
#
# With it OFF, Warden's guarantee is narrower and honest: no tool gains
# capability without a human. Changes that gain nothing are accepted.
# With it ON, Warden additionally treats "contract changed but version did not"
# as hostile, which is the strongest signal available - but only turn it on for
# a server you know versions itself properly.
servers:
  notes-mcp:
    version_is_authoritative: true

# Scopes no tool may ever declare, regardless of who published it.
# Warden derives tool.read / tool.write / tool.destructive / tool.openworld
# from the MCP behaviour hints, so these work against servers that never heard
# of Warden. Uncomment tool.destructive to refuse every destructive tool.
denied_scopes:
  - shell.exec
  - process.spawn
  - credentials.read
  - network.raw
  - tool.destructive

# Per-tool rules.
tools:
  - server: notes-mcp
    tool: search_notes
    deny_arg_contains:
      query: [".env", "id_rsa", "password", "secret_key"]
    max_calls: 500

  - server: notes-mcp
    tool: list_notes
    max_calls: 500

  - server: filesystem-mcp
    tool: read_file
    allow_arg_prefixes:
      path: ["/workspace/", "./data/"]
    deny_arg_contains:
      path: [".env", ".ssh", "id_rsa", "credentials", ".aws"]
    max_calls: 200
